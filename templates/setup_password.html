<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Set Password - 9-grid Security</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      background: #0f172a;
      color: #e6eef8;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 28px;
      align-items: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 120px);
      grid-template-rows: repeat(3, 120px);
      gap: 10px;
    }
    .cell {
      background: linear-gradient(180deg, #1e293b, #0b1220);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor: pointer;
      user-select: none;
      font-weight: bold;
      font-size: 20px;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      box-shadow: 0 6px 18px rgba(2,6,23,0.6);
    }
    .cell:hover { transform: translateY(-4px); box-shadow: 0 10px 26px rgba(2,6,23,0.7); }
    .cell.selected { 
      background: linear-gradient(180deg, #3b82f6, #1d4ed8);
      border-color: #60a5fa;
    }
    .controls {
      width: 320px;
    }
    button {
      width:100%;
      padding:10px 14px;
      border-radius:8px;
      border: none;
      background: #2563eb;
      color:white;
      font-weight:600;
      cursor:pointer;
      margin-top:8px;
    }
    button:disabled {
      background: #64748b;
      cursor: not-allowed;
    }
    .button-secondary {
      background: #475569;
    }
    .small {
      font-size:13px;
      opacity:0.85;
    }
    .info {
      margin-top:12px;
      background: rgba(255,255,255,0.02);
      padding:10px;
      border-radius:8px;
      font-size:14px;
    }
    .password-display {
      margin: 20px 0;
      padding: 15px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      text-align: center;
      font-size: 18px;
      letter-spacing: 8px;
      min-height: 30px;
    }
    .message {
      padding: 10px;
      border-radius: 6px;
      margin: 10px 0;
      text-align: center;
    }
    .error { background: rgba(239,68,68,0.2); color: #fca5a5; }
    .success { background: rgba(34,197,94,0.2); color: #86efac; }
  </style>
</head>
<body>
  <div class="container">
    <div>
      <div class="grid" id="grid">
        <!-- 9 cells -->
        <div class="cell" data-id="1">1</div>
        <div class="cell" data-id="2">2</div>
        <div class="cell" data-id="3">3</div>

        <div class="cell" data-id="4">4</div>
        <div class="cell" data-id="5">5</div>
        <div class="cell" data-id="6">6</div>

        <div class="cell" data-id="7">7</div>
        <div class="cell" data-id="8">8</div>
        <div class="cell" data-id="9">9</div>
      </div>
    </div>

    <div class="controls">
      <h2 id="pageTitle">Set Your Password</h2>
      <p class="small" id="pageDescription">
        Create a password by clicking at least 4 grid cells in your desired sequence.
      </p>

      <div class="password-display" id="passwordDisplay">
        <span id="passwordDots"></span>
      </div>

      <div id="messageArea"></div>

      <button id="submitBtn" disabled>Submit Password</button>
      <button id="resetBtn" class="button-secondary">Reset Sequence</button>
      <button id="backBtn" class="button-secondary">Back to Setup</button>

      <div class="info">
        <div>Eye tracker: <span id="eyeStatus">starting...</span></div>
        <div id="screenSize"></div>
        <div style="margin-top:8px; font-size:12px; color: #9fb7ff;">
          Your password will be stored in this browser session only.
        </div>
      </div>
    </div>
  </div>

  <script>
    const grid = document.getElementById('grid');
    const eyeStatus = document.getElementById('eyeStatus');
    const screenSize = document.getElementById('screenSize');
    const passwordDisplay = document.getElementById('passwordDots');
    const submitBtn = document.getElementById('submitBtn');
    const resetBtn = document.getElementById('resetBtn');
    const backBtn = document.getElementById('backBtn');
    const messageArea = document.getElementById('messageArea');
    const pageTitle = document.getElementById('pageTitle');
    const pageDescription = document.getElementById('pageDescription');

    let passwordSequence = [];
    const mode = "{{ mode }}";  // This will be 'setup' or 'confirm'

    // Set page content based on mode
    if (mode === 'confirm') {
      pageTitle.textContent = 'Confirm Your Password';
      pageDescription.textContent = 'Re-enter your password sequence to confirm.';
    }

    // Fetch status
    fetch('/status').then(r => r.json()).then(j => {
      eyeStatus.innerText = j.eye_tracker_running ? 'running' : 'not running';
      screenSize.innerText = `Screen: ${j.screen_width} × ${j.screen_height}`;
    }).catch(e => {
      eyeStatus.innerText = 'error';
    });

    // Grid click handler
    grid.addEventListener('click', (ev) => {
      const cell = ev.target.closest('.cell');
      if (!cell) return;
      
      const id = cell.dataset.id;
      passwordSequence.push(id);
      
      // Update display
      updatePasswordDisplay();
      
      // Visual feedback
      cell.classList.add('selected');
      setTimeout(() => cell.classList.remove('selected'), 300);
      
      // Enable submit if we have at least 4 digits
      if (passwordSequence.length >= 4) {
        submitBtn.disabled = false;
      }
    });

    // Submit button handler
    submitBtn.addEventListener('click', () => {
      if (passwordSequence.length < 4) {
        showMessage('Password must be at least 4 digits', 'error');
        return;
      }

      fetch('/save-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ password: passwordSequence })
      }).then(r => r.json()).then(j => {
        if (j.status === 'ok') {
          window.location.href = j.redirect;
        } else {
          showMessage(j.msg, 'error');
          if (mode === 'confirm') {
            // Clear sequence on failed confirmation
            passwordSequence = [];
            updatePasswordDisplay();
            submitBtn.disabled = true;
          }
        }
      }).catch(err => {
        showMessage('Error saving password', 'error');
        console.error(err);
      });
    });

    // Reset button handler
    resetBtn.addEventListener('click', () => {
      passwordSequence = [];
      updatePasswordDisplay();
      submitBtn.disabled = true;
      clearMessage();
    });

    // Back button handler (only show in confirm mode)
    backBtn.addEventListener('click', () => {
      if (mode === 'confirm') {
        window.location.href = '/reset-password';
      } else {
        window.location.href = '/';
      }
    });

    // Update back button visibility
    if (mode === 'setup') {
      backBtn.style.display = 'none';
    }

    function updatePasswordDisplay() {
      const dots = '•'.repeat(passwordSequence.length);
      passwordDisplay.textContent = dots;
    }

    function showMessage(text, type) {
      messageArea.innerHTML = `<div class="message ${type}">${text}</div>`;
    }

    function clearMessage() {
      messageArea.innerHTML = '';
    }

    // Initialize display
    updatePasswordDisplay();
  </script>
</body>
</html>
